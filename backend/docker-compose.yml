version: '3.1'

services:

  db:
    image: postgres:10
    container_name: odoo13-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - postgres-data:/var/lib/postgresql/data

  odoo:
    image: odoo:13
    container_name: odoo13
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    command: odoo -c /etc/odoo/odoo.conf

volumes:
  postgres-data: