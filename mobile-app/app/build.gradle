plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.jazaldcorp.inveragrovendedores'
    compileSdk 36

    defaultConfig {
        applicationId "com.jazaldcorp.inveragrovendedores"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // --- LIBRERÍAS DEL PROYECTO AGRO ---

    def room_version = "2.6.1"
    def retrofit_version = "2.9.0"

    // 1. Room (Base de Datos Local Offline)
    implementation("androidx.room:room-runtime:$room_version")
    annotationProcessor("androidx.room:room-compiler:$room_version")

    // 2. Retrofit y GSON (Para conectar con tu backend en Node.js)
    implementation("com.squareup.retrofit2:retrofit:$retrofit_version")
    implementation("com.squareup.retrofit2:converter-gson:$retrofit_version")

    // 3. Google Play Services Location (Para capturar coordenadas sin el mapa visual)
    implementation("com.google.android.gms:play-services-location:21.2.0")
    implementation("com.google.android.gms:play-services-maps:18.2.0")

    // 4. Lifecycle (Para mantener la arquitectura limpia entre la UI y los datos)
    implementation("androidx.lifecycle:lifecycle-viewmodel:2.7.0")
    implementation("androidx.lifecycle:lifecycle-livedata:2.7.0")


    implementation 'com.makeramen:roundedimageview:2.3.0'

    // 5. Compresión de video antes de subir (Media3 Transformer)
    implementation(libs.media3.transformer)
    implementation(libs.media3.common)

}